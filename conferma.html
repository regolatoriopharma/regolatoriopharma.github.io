<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Conferma dell'iscrizione al digest di Osservatorio Regolatorio Pharma.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#x1F48A;</text></svg>">
<link rel="stylesheet" href="fonts.css">
<title>Conferma iscrizione &ndash; Osservatorio Regolatorio Pharma</title></head><body>
<div style="font-family:'Public Sans',Arial,Helvetica,sans-serif;color:#1a1a1a;max-width:680px">

<h2 style="margin:0 0 4px">Conferma iscrizione</h2>
<p style="color:#0b5394;margin:0 0 20px;font-size:13px;font-style:italic">Regulatory intelligence quotidiana e gratuita</p>

<div style="background:#eef4fb;border:1px solid #cfe0f2;border-radius:8px;padding:16px;margin:0 0 24px">

  <p id="titolo" style="margin:0 0 10px;font-size:15px;font-weight:bold;color:#0b5394">Manca solo un clic</p>
  <p id="messaggio" style="margin:0 0 14px;font-size:14px;color:#333;line-height:1.6">Premi il pulsante per completare l&rsquo;iscrizione. Da domani mattina ricevi il digest.</p>

  <p id="riga-pulsante" style="margin:0">
    <button type="button" id="conferma"
            style="display:inline-block;background:#0b5394;color:#fff;border:none;cursor:pointer;
                   padding:11px 22px;border-radius:6px;font-size:14px;font-weight:bold;font-family:inherit">Conferma l&rsquo;iscrizione</button>
  </p>

  <noscript>
    <p style="margin:10px 0 0;font-size:13px;color:#333;line-height:1.6">Questa pagina ha bisogno di JavaScript. Se il tuo browser non lo permette, scrivi a <a href="mailto:info@regolatoriopharma.it" style="color:#0b5394">info@regolatoriopharma.it</a>: completiamo noi l&rsquo;iscrizione.</p>
  </noscript>

</div>

<p style="margin:0 0 16px;font-size:14px">
  <a href="index.html" style="color:#0b5394">&larr; Torna alla home</a> &nbsp;&middot;&nbsp;
  <a href="archivio.html" style="color:#0b5394">Archivio</a>
</p>

<hr style="border:none;border-top:1px solid #ddd;margin:24px 0 12px">
<p style="color:#999;font-size:11px;margin:0">Servizio indipendente, gratuito. &mdash; <a href="privacy.html" style="color:#999">Privacy</a></p>

</div>
<script>(function () {
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxdNi-6WUwGF71AURqu_v8xmIiXZ-ZhW_BaTm0PiCPx4IZStmZf7Lf3GCml-uHqaRYhlw/exec';

  var titolo = document.getElementById('titolo');
  var messaggio = document.getElementById('messaggio');
  var riga = document.getElementById('riga-pulsante');
  var pulsante = document.getElementById('conferma');

  function mostra(t, m) {
    titolo.textContent = t;
    messaggio.innerHTML = m;
    riga.style.display = 'none';
  }

  var m = /[?&]t=([^&#]*)/.exec(location.search);
  var token = m ? decodeURIComponent(m[1]) : '';

  if (!token) {
    mostra('Collegamento incompleto',
      'Questo indirizzo non contiene il codice di conferma. Apri il collegamento direttamente dall&rsquo;email che ti abbiamo mandato, oppure ' +
      '<a href="iscriviti.html" style="color:#0b5394">iscriviti di nuovo</a>.');
    return;
  }

  // La conferma parte SOLO da questo clic, e viaggia come POST.
  // Il 02/09/2026 il gateway di sicurezza di una casella aziendale ha aperto
  // da solo il link dell'email 31 secondi dopo l'invio e ha confermato al
  // posto della persona: aprire una pagina non deve cambiare niente.
  pulsante.addEventListener('click', function () {
    pulsante.disabled = true;
    pulsante.style.opacity = '0.6';
    pulsante.textContent = 'Un momento…';

    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ azione: 'conferma', t: token })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) {
          mostra(d.titolo || 'Iscrizione confermata', d.messaggio || '');
        } else {
          mostra((d && d.titolo) || 'Conferma non riuscita',
            ((d && d.messaggio) || '') + ' <a href="iscriviti.html" style="color:#0b5394">Iscriviti di nuovo</a>.');
        }
      })
      .catch(function () {
        pulsante.disabled = false;
        pulsante.style.opacity = '1';
        pulsante.textContent = 'Conferma l’iscrizione';
        messaggio.innerHTML = 'Non siamo riusciti a registrare la conferma. Riprova fra qualche minuto, oppure scrivi a ' +
          '<a href="mailto:info@regolatoriopharma.it" style="color:#0b5394">info@regolatoriopharma.it</a>.';
      });
  });
})();</script>
</body></html>
